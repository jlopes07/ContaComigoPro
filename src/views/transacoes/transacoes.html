<div class="page-section" id="page-transacoes">
    <section class="transactions-section filter-container">
        <div class="filters" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
            <input type="text" id="filter-search" class="form-input" placeholder="Buscar por descrição..." style="flex: 1; min-width: 180px;">
            
            <select id="filter-type" class="form-input" style="width: 150px;">
                <option value="all">Todas as transações</option>
                <option value="income">Apenas Receitas</option>
                <option value="expense">Apenas Despesas</option>
            </select>

            <!-- Filtro Multi-Select para Bancos e Cartões -->
            <div class="multi-select-container" id="filter-pm-container" style="position: relative; min-width: 180px;">
                <button type="button" class="form-input multi-select-btn" id="btn-filter-pm" style="display: flex; justify-content: space-between; align-items: center; width: 100%; height: 38px; cursor: pointer; font-size: 0.85rem; padding: 0 12px; background: var(--bg-body); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main);">
                    <span id="label-filter-pm"><i class="fa-solid fa-building-columns" style="color: var(--primary);"></i> Todos os Meios</span>
                    <i class="fa-solid fa-chevron-down" style="font-size: 0.75rem; color: var(--text-muted);"></i>
                </button>
                <div class="multi-select-dropdown" id="dropdown-filter-pm" style="display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 100; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 8px; box-shadow: var(--shadow-md); max-height: 240px; overflow-y: auto; margin-top: 4px;">
                    <!-- Povoado dinamicamente via JS -->
                </div>
            </div>

            <select id="filter-category" class="form-input" title="Filtrar por Categoria" style="width: 140px;">
                <option value="all">Todas Categ.</option>
            </select>

            <input type="date" id="filter-date-start" class="form-input" title="Data Inicial" style="width: 130px;">
            <span style="color: var(--text-muted); font-weight: bold; font-size: 0.85rem;">a</span>
            <input type="date" id="filter-date-end" class="form-input" title="Data Final" style="width: 130px;">

            <button id="btn-clear-filters" class="btn-icon" title="Limpar Filtros" style="height: 38px; width: 38px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-body); cursor: pointer;">
                <i class="fa-solid fa-eraser"></i>
            </button>
            
            <button id="btn-show-pending-installments" class="btn btn-outline" style="height: 38px; padding: 0 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-body); color: var(--text-main); font-weight: 500; font-size: 0.85rem;" title="Compras Parceladas Pendentes">
                <i class="fa-solid fa-calendar-days" style="color: var(--primary);"></i> Parceladas
            </button>
        </div>
    </section>

    <!-- Barra Leve de Saldo Filtrado (Sem Receitas/Despesas pesadas) -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 12px 0 16px 0; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;">
        <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">
            <i class="fa-solid fa-wallet" style="color: var(--primary);"></i> Total do Período Filtrado:
        </span>
        <span id="filtered-balance" style="font-size: 1.2rem; font-weight: 700; color: var(--text-main);">R$ 0,00</span>
    </div>

    <!-- Lista de Transações (Limite de 25 itens por página) -->
    <section class="transactions-section">
        <div class="transactions-list" id="transaction-list-complete"></div>
        
        <!-- Paginação -->
        <div class="pagination-container" id="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;">
            <button class="btn btn-secondary" id="btn-prev-page" style="padding: 6px 14px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-chevron-left"></i> Anterior
            </button>
            <span id="pagination-info" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Página 1 de 1</span>
            <button class="btn btn-secondary" id="btn-next-page" style="padding: 6px 14px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px;">
                Próximo <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </section>
</div>
